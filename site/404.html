<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Circuit ouvert — Alexis Trudelle</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/404.js" defer></script>
</head>
<body>
  <main class="e404">
    <div>
      <svg class="e404-svg" viewBox="0 0 520 220" role="img" aria-labelledby="e404-desc">
        <desc id="e404-desc">Une piste de circuit est coupée : rebranchez le fil sur la pastille de droite pour fermer le circuit.</desc>
        <defs>
          <radialGradient id="g-led404" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#52ff86" stop-opacity=".9"/><stop offset="1" stop-color="#52ff86" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="e-mask" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e6c50"/><stop offset=".55" stop-color="#175a42"/><stop offset="1" stop-color="#104533"/></linearGradient>
          <pattern id="e-weave" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 2.5 H5 M2.5 0 V5" stroke="#ffffff" stroke-opacity=".03" stroke-width=".8"/></pattern>
          <radialGradient id="e-sheen" cx=".22" cy=".12" r=".95"><stop offset="0" stop-color="#ffffff" stop-opacity=".1"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".02"/><stop offset="1" stop-color="#000000" stop-opacity=".12"/></radialGradient>
          <linearGradient id="e-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".35" stop-color="#e2b34f"/><stop offset=".7" stop-color="#b07d22"/><stop offset="1" stop-color="#e9c66a"/></linearGradient>
          <radialGradient id="e-solder" cx=".36" cy=".3" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#e1e5e7"/><stop offset=".75" stop-color="#9aa3a8"/><stop offset="1" stop-color="#6d767b"/></radialGradient>
          <linearGradient id="e-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f7579"/><stop offset=".3" stop-color="#f2f4f4"/><stop offset=".55" stop-color="#b9bfc2"/><stop offset="1" stop-color="#5e6468"/></linearGradient>
          <linearGradient id="e-bat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e1011"/><stop offset=".3" stop-color="#3f4548"/><stop offset=".6" stop-color="#202426"/><stop offset="1" stop-color="#0b0c0d"/></linearGradient>
          <linearGradient id="e-orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a470b"/><stop offset=".3" stop-color="#f6a447"/><stop offset=".62" stop-color="#e0821f"/><stop offset="1" stop-color="#7c3f09"/></linearGradient>
          <radialGradient id="e-led-off" cx=".38" cy=".32" r=".78"><stop offset="0" stop-color="#8fd6a4"/><stop offset=".4" stop-color="#2f7a4a"/><stop offset="1" stop-color="#0f2a19"/></radialGradient>
          <linearGradient id="e-lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7d3b2"/><stop offset="1" stop-color="#a3b28c"/></linearGradient>
          <linearGradient id="e-plastic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454b4e"/><stop offset=".45" stop-color="#202426"/><stop offset="1" stop-color="#0e1011"/></linearGradient>
          <filter id="e-shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000000" flood-opacity=".55"/></filter>
          <g id="e-tr"><path d="M58 110 H200"/><path d="M320 110 H430 V80"/><path d="M430 40 V30 H40 V80"/></g>
        </defs>
        <!-- Carte : vernis épargne, pistes sous le vernis, piste coupée au cutter -->
        <rect x="2" y="2" width="516" height="216" rx="16" fill="url(#e-mask)" stroke="#0a2a20" stroke-width="2"/>
        <rect x="2" y="2" width="516" height="216" rx="16" fill="url(#e-weave)"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <use href="#e-tr" stroke="#0b3527" stroke-width="10"/>
          <use href="#e-tr" stroke="#2a8a60" stroke-width="7"/>
          <path d="M200 110 H246 l3 -4 l2 6 l3 -5" stroke="#0b3527" stroke-width="10"/>
          <path d="M200 110 H246 l3 -4 l2 6 l3 -5" stroke="#2a8a60" stroke-width="7"/>
          <path d="M274 110 l-3 4 l-2 -6 l-3 5 M274 110 H320" stroke="#0b3527" stroke-width="10"/>
          <path d="M274 110 H320" stroke="#2a8a60" stroke-width="7"/>
          <path d="M252 98 L266 122" stroke="#0a1f17" stroke-width="5"/>
          <path d="M253 99 L265 121" stroke="#c97b2a" stroke-width="1.4" opacity=".8"/>
        </g>
        <g class="e404-flow" fill="none" stroke="#ffe0ad" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 15">
          <path d="M58 110 H200 M320 110 H430 V80 M430 40 V30 H40 V80"/>
        </g>
        <rect x="2" y="2" width="516" height="216" rx="16" fill="url(#e-sheen)"/>
        <g aria-hidden="true">
          <circle cx="18" cy="18" r="7" fill="url(#e-gold)"/><circle cx="18" cy="18" r="4" fill="#04100c"/>
          <circle cx="502" cy="18" r="7" fill="url(#e-gold)"/><circle cx="502" cy="18" r="4" fill="#04100c"/>
          <circle cx="18" cy="202" r="7" fill="url(#e-gold)"/><circle cx="18" cy="202" r="4" fill="#04100c"/>
          <circle cx="502" cy="202" r="7" fill="url(#e-gold)"/><circle cx="502" cy="202" r="4" fill="#04100c"/>
        </g>
        <!-- Pile 9 V -->
        <g filter="url(#e-shadow)">
          <rect x="24" y="78" width="34" height="52" rx="4" fill="url(#e-bat)"/>
          <rect x="24" y="92" width="34" height="26" fill="url(#e-orange)"/>
          <rect x="26" y="74" width="30" height="6" rx="2" fill="url(#e-metal)"/>
        </g>
        <text class="silk silk-sm" x="30" y="109">9V</text>
        <circle cx="40" cy="80" r="4.5" fill="url(#e-solder)" stroke="url(#e-gold)" stroke-width="2"/>
        <circle cx="58" cy="110" r="4.5" fill="url(#e-solder)" stroke="url(#e-gold)" stroke-width="2"/>
        <!-- LED verte vue de dessus -->
        <circle class="e404-glow" cx="430" cy="60" r="34" fill="url(#g-led404)"/>
        <rect x="428.6" y="38" width="2.8" height="8" fill="url(#e-metal)"/><rect x="428.6" y="74" width="2.8" height="8" fill="url(#e-metal)"/>
        <g filter="url(#e-shadow)">
          <path d="M416.3 69 A17 17 0 1 1 443.7 69 Z" fill="#1d4a2c" stroke="#0b2018"/>
          <circle class="e404-led" cx="430" cy="60" r="13"/>
        </g>
        <ellipse cx="425" cy="54" rx="4.5" ry="2.6" transform="rotate(-35 425 54)" fill="#ffffff" opacity=".55"/>
        <circle cx="430" cy="40" r="4.5" fill="url(#e-solder)" stroke="url(#e-gold)" stroke-width="2"/>
        <circle cx="430" cy="80" r="4.5" fill="url(#e-solder)" stroke="url(#e-gold)" stroke-width="2"/>
        <text class="silk silk-sm" x="452" y="64">LED</text>
        <!-- Écran du multimètre -->
        <g filter="url(#e-shadow)">
          <rect x="354" y="144" width="132" height="52" rx="8" fill="url(#e-plastic)"/>
        </g>
        <rect x="360" y="150" width="120" height="40" rx="4" fill="url(#e-lcd)" stroke="#0f1112" stroke-width="2"/>
        <path d="M364 154 L392 154 L370 186 L364 186 Z" fill="#ffffff" opacity=".18"/>
        <text class="e404-lcd" x="420" y="178" text-anchor="middle">O.L</text>
        <text class="silk silk-sm" x="40" y="204">ERREUR 404 · PISTE COUPÉE</text>
        <!-- Pastilles de part et d'autre de la coupure -->
        <circle cx="200" cy="110" r="11" fill="url(#e-gold)"/>
        <circle cx="200" cy="110" r="6.5" fill="url(#e-solder)"/>
        <circle class="e404-target" cx="320" cy="110" r="11" fill="url(#e-gold)"/>
        <circle cx="320" cy="110" r="4" fill="#04100c"/>
        <circle class="e404-ring" cx="320" cy="110" r="18"/>
        <path class="e404-wire" d="M200 110 C210 160 220 166 227 164" fill="none" stroke="#c4241b" stroke-width="5" stroke-linecap="round"/>
        <g class="e404-tip" tabindex="0" role="button" aria-label="Extrémité du fil : glissez-la sur la pastille de droite (ou appuyez sur Entrée)">
          <circle class="e404-grab" cx="0" cy="0" r="24"/>
          <rect x="-9" y="-6" width="18" height="12" rx="3" fill="#c4241b"/>
          <rect x="-9" y="-6" width="18" height="4" rx="2" fill="#ffffff" opacity=".22"/>
          <rect x="7" y="-3" width="9" height="6" rx="1" fill="url(#e-metal)"/>
        </g>
      </svg>
      <h1>Circuit ouvert</h1>
      <p class="e404-msg" aria-live="polite">Cette page n'existe pas : la piste est coupée. <strong>Rebranchez le fil</strong> sur la pastille de droite pour retrouver le chemin de l'accueil.</p>
      <p><a class="e404-skip" href="/">Ou retourner directement à l'accueil</a></p>
    </div>
  </main>
</body>
</html>
