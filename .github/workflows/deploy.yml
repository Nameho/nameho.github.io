# Met à jour la veille technologique puis publie le site sur GitHub Pages.
# - à chaque envoi (push) sur main
# - tous les jours à 5 h 17 UTC (7 h 17 à Paris l'été)
# - à la main depuis l'onglet « Actions » (bouton « Run workflow »)
name: Veille + déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Par défaut, aucun droit : chaque tâche demande seulement ce dont elle a besoin.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veille:
    name: Mettre à jour la veille
    # Ne tourne pas sur les copies (forks) du dépôt
    if: github.repository_owner == 'Nameho' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pour enregistrer site/data/veille.json
    steps:
      # Actions épinglées par leur empreinte (SHA) : une étiquette peut être déplacée, pas un SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupérer les flux RSS
        run: node scripts/veille.mjs

      - name: Enregistrer les nouveautés
        run: |
          if git diff --quiet -- site/data/veille.json; then
            echo "Pas de nouvel article."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/veille.json
          git commit -m "Veille : mise à jour automatique"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Publier le site
    needs: veille
    if: always() && github.repository_owner == 'Nameho' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # inclut la veille fraîchement enregistrée
          persist-credentials: false

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
